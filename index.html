<style>

.btn-d{background:transparent;color:#d99a8a}.btn-d:hover{background:#fceee8;color:#c9786a}

<body>

const ARTICLES=[
{t:"The Power of Small Habits",e:"Small habits may seem meaningless at first, but they shape who we become. Reading ten pages a day, walking for twenty minutes, or writing three sentences before bed — these tiny actions add up. You do not need to change your life overnight. You only need to be a little better today than yesterday. Over time, small steps create big distance.",z:"小习惯起初看似毫无意义，但它们塑造了我们成为什么样的人。每天读十页书、散步二十分钟、睡前写三句话——这些微小的行动会累积起来。你不需要一夜之间改变人生。你只需要今天比昨天好一点点。时间久了，小步也能走出很远的距离。"},
{t:"A Morning That Starts Well",e:"How you start your morning often decides how you spend your day. Instead of reaching for your phone, try drinking a glass of water, stretching for five minutes, and writing down one important thing. A calm morning gives your mind space to breathe. It is not about being perfect; it is about being intentional.",z:"你如何开始早晨，往往决定了你如何度过这一天。与其拿起手机，不如先喝一杯水、伸展五分钟、写下一件重要的事。一个平静的早晨会给大脑呼吸的空间。这不是追求完美，而是有意识的开始。"},
{t:"Learning Is a Lifelong Journey",e:"Many people think learning ends after school, but real learning begins when no one is testing you. Every book you read, every conversation you have, and every mistake you make teaches you something. Stay curious. Ask questions. The world is full of teachers if you are willing to listen.",z:"很多人认为学习在学校就结束了，但真正的学习始于没有人考你的时候。你读的每一本书、进行的每一次对话、犯的每一个错误都会教会你一些东西。保持好奇，提出问题。如果你愿意倾听，世界处处是老师。"},
{t:"Why Rest Matters",e:"Rest is not a reward for hard work; it is part of it. When you rest well, your brain remembers better, your mood improves, and your creativity returns. Do not feel guilty for taking breaks. A tired mind cannot see clearly. Sometimes doing nothing is the most productive thing you can do.",z:"休息不是努力工作的奖励，而是工作的一部分。当你休息好时，大脑记忆更好、情绪更佳、创造力也会回归。不要为休息感到内疚。疲惫的大脑看不清方向。有时候，什么都不做反而是你最能提高效率的事。"},
{t:"The Gift of Attention",e:"In a world full of notifications, attention has become rare. When you give someone your full attention, you give them a gift. Put down your phone, look into their eyes, and really listen. People may forget what you said, but they will remember how you made them feel.",z:"在一个充满通知的世界里，注意力变得稀缺。当你全神贯注地对待一个人时，你是在送他们一份礼物。放下手机，看着对方的眼睛，真正倾听。人们可能会忘记你说的话，但会记得你带给他们的感受。"},
{t:"Gratitude Changes Everything",e:"It is easy to focus on what we do not have. But when we take a moment to notice what we do have, our whole mood shifts. Gratitude does not mean ignoring problems. It means choosing to see the good alongside the hard. Start with one thing each day, and watch your heart grow lighter.",z:"我们很容易关注自己没有什么。但当我们花点时间留意自己拥有什么时，整个心情都会转变。感恩不代表忽视问题，而是选择在困难中也看到美好。每天从一件小事开始，你会发现心变得轻盈。"},
{t:"Courage Is Not the Absence of Fear",e:"Being brave does not mean you are never afraid. It means you move forward even when fear is present. Everyone feels nervous before trying something new. The difference is action. You can be scared and still take the next step. That is what courage really looks like.",z:"勇敢不代表从不害怕。它意味着即使害怕，你依然前行。每个人在尝试新事物前都会紧张。区别在于行动。你可以害怕，但仍然迈出下一步。这才是真正的勇气。"},
{t:"The Value of Silence",e:"We live in a noisy world. Silence gives us a chance to hear our own thoughts. You do not need to fill every quiet moment with music or conversation. Sit with silence for five minutes. You may be surprised by what your heart has been trying to tell you.",z:"我们生活在一个嘈杂的世界里。沉默让我们有机会听到自己的想法。你不需要用音乐或对话填满每一个安静的时刻。与沉默共处五分钟，你可能会惊讶地发现，内心一直在试图告诉你什么。"},
{t:"Kindness Comes Back",e:"A kind word, a small help, or a simple smile can change someone's day. Kindness does not cost anything, but it creates connection. When you are kind to others, you also become softer with yourself. The world has enough criticism. Be someone who adds warmth.",z:"一句善意的话、一点小小的帮助、一个简单的微笑，都能改变某个人的一天。善意不需要任何成本，却能建立连接。当你善待他人时，你也会对自己更温柔。这个世界已经有足够多的批评，做一个带来温暖的人吧。"},
{t:"Your Future Self Is Watching",e:"Every choice you make today is a vote for the person you want to become. One workout, one healthy meal, one page read — they all count. Your future self cannot speak to you now, but they will thank you later. Make today a day they would be proud of.",z:"你今天的每一个选择，都在为你想成为的人投票。一次锻炼、一顿健康的饭、一页书——它们都很重要。未来的自己现在无法与你对话，但日后会感谢你。让今天成为他们会感到骄傲的一天。"}

{brief:"今天学一个让人印象深刻的开场方式",full:"开场白决定别人对你的第一印象。试试用一句有趣的观察或反问切入，比'大家好'更有吸引力。比如：'你们有没有发现，最忙的人反而最有时间？'",tip:"开场三秒定胜负。不要平淡问候，用一个小钩子拉住注意力。"},
{brief:"用'三个关键词'法组织思路",full:"说话前想好三个关键词，围绕它们展开。比如介绍自己：'好奇、行动、温度'——好奇让我探索，行动让我落地，温度让我共情。",tip:"三个关键词比长篇大论更容易被记住。"},
{brief:"说话要有'节奏感'——快慢交替",full:"重要观点放慢语速，过渡信息可以加快。像音乐一样有高低起伏，听众才不会走神。",tip:"平铺直叙=催眠曲。关键处停顿1秒，效果翻倍。"},
{brief:"结尾要有力——别让话'散掉'",full:"结尾用一个总结句或行动号召收束。比如：'所以，今天我们做一件事就好——开始。'不要用'就这样吧'来收尾。",tip:"结尾是最后的印象，不要让它变成'嗯…就这些'。"},
{brief:"学会用比喻让复杂概念变简单",full:"把抽象概念映射到生活场景。比如：'自律不是监狱，而是方向舵——它不是限制自由，而是引导自由。'",tip:"好比喻让听众秒懂，比解释五分钟更有效。"},
{brief:"回应前先重复对方的关键词",full:"当对方说完，先重复一个关键词再回应。这表示你在认真听，也让对话有连贯性。比如：'你说的「节奏感」很有意思…'",tip:"重复关键词=我听见了你。比'嗯嗯对对对'高级得多。"},
{brief:"避免用'其实'开头",full:"'其实'是口语中的稀释词，会让后面的内容显得没那么重要。直接说你的观点，不加铺垫。",tip:"删掉'其实'、'说白了'、'个人感觉'——你的话不需要打折。"},
{brief:"练习'一句话总结'能力",full:"每次讨论后，尝试用一句话概括核心。这锻炼你的提炼和逻辑能力。比如：'核心就是：先有输入，才有输出。'",tip:"一句话总结是你对内容的真正理解。做不到=没懂透。"},
{brief:"用'反过来想'制造冲突感",full:"说观点时，先抛出反面：'大家都觉得XX是对的，但我想说…'这种冲突让听众大脑被激活。",tip:"冲突=注意力。不要只说正面的，先制造一个对立面。"},
{brief:"用具体数字代替模糊描述",full:"'很多人'→'80%的人'，'花了很久'→'3个月'。数字让话有力量，也显得你做过功课。",tip:"模糊=不靠谱。具体数字=有依据。哪怕估算也比'很多'好。"},
{brief:"练习'3句话输出法'",full:"任何话题，练习用3句话说完：1句观点→1句论据→1句结论。简洁是最高级的能力。",tip:"能3句话说完的，就不要用10句。冗长=思维混乱。"},
{brief:"倾听时做笔记——用关键词记",full:"听人说话时，在脑中提取关键词。不记全句，只记核心词。这让你回应时能精准引用对方内容。",tip:"关键词笔记比全文笔记高效10倍。"},
{brief:"别怕沉默——停顿是力量",full:"说完重要观点后停顿2秒。沉默不是尴尬，而是给听众消化时间。敢于停顿的人显得更自信。",tip:"敢停=敢控场。急着填补沉默反而暴露紧张。"}

const PHOTO=[
{cat:"光影",t:"自然光人像：黄金时段拍摄",d:"日出后和日落前1小时是最佳自然光时段，光线柔和有方向性。让模特侧对光源，面部一半亮一半暗，立体感立刻提升。",tip:"避免正午顶光——硬光让面部阴影生硬不讨好"},
{cat:"光影",t:"逆光剪影效果",d:"让模特背对光源，降低曝光补偿，人物变成优雅剪影。适合在窗边、日落时拍摄，轮廓线条比细节更有表现力。",tip:"剪影的重点是轮廓，让模特做伸展或侧身姿势"},
{cat:"光影",t:"室内柔光窗边拍摄",d:"大窗户是免费的柔光箱。模特面向窗户，光线均匀柔和，皮肤质感通透自然。白纱窗帘可以进一步柔化光线。",tip:"远离窗户1-2米效果最佳，太近光线反而偏硬"},
{cat:"光影",t:"灯光氛围感营造",d:"傍晚用台灯、落地灯做主光源，暖色调灯光营造温馨氛围。让灯光从侧面照射，面部立体又有故事感。",tip:"关掉顶灯只用侧灯，氛围感直接翻倍"},
{cat:"姿势",t:"自然走路姿态抓拍",d:"让模特慢速行走，你在侧面连续拍摄。走路时身体有自然重心转移，比摆拍姿势更生动真实。",tip:"让模特走3步以上再按快门，前两步还在适应"},
{cat:"姿势",t:"侧身回眸姿势",d:"模特侧身站立，然后转头看向镜头。侧身让身体线条更修长，回眸瞬间眼神最自然有神。",tip:"回眸时下巴微收，眼睛看镜头上方一点更精神"},
{cat:"姿势",t:"坐姿延伸线条",d:"让模特坐在椅子边缘，一条腿向前延伸，手臂搭椅背。坐姿比站姿更放松，延伸的线条拉长视觉比例。",tip:"不要坐满椅子，坐边缘1/3更显精神"},
{cat:"姿势",t:"倚靠姿势增加故事感",d:"让模特倚靠墙壁、栏杆、门框。倚靠产生自然的重心转移，手有地方放，姿态不僵硬有故事感。",tip:"肩膀轻轻靠而非整个人贴，保持一份松弛"},
{cat:"构图",t:"三分法构图基础",d:"将画面横竖各分三份，把人物放在交叉点位置。这是最稳妥又最有效的构图法，画面立刻有重点和平衡感。",tip:"手机相机设置里打开网格线辅助三分法"},
{cat:"构图",t:"对角线构图增加动感",d:"让模特的身体线条或视线沿对角线方向排列。对角线比横平竖直更有张力，画面显得有动势和故事推进感。",tip:"手臂伸展、腿的走向、视线方向都可以做对角线"},
{cat:"构图",t:"前景遮挡营造层次",d:"在镜头前放花枝、树叶、窗帘等做前景，半遮挡人物。前景增加画面层次和纵深感，也制造朦胧浪漫氛围。",tip:"前景不要太密，留出人物关键部位（眼睛+表情）"},
{cat:"构图",t:"极简构图突出人物",d:"大面积留白+小面积人物。干净的背景让人物成为唯一焦点，画面高级感拉满。适合白墙、天空、水面做背景。",tip:"留白不是空白——选有质感的简洁背景"},
{cat:"调色",t:"低饱和柔调色调",d:"降低整体饱和度，提升明度，色温偏暖。这种色调皮肤通透有质感，画面温柔高级，适合人像和日常场景。",tip:"降饱和的同时保持肤色自然，不要变成灰白"},
{cat:"调色",t:"胶片感复古色调",d:"加一点颗粒感，色温偏暖偏黄，暗部加青蓝。模拟胶片的色调有年代感和故事感，适合街拍和人文场景。",tip:"颗粒感要轻，太重像劣质照片而非胶片"},
{cat:"调色",t:"清透日系色调",d:"高明度+低对比+偏冷色温。日系色调干净通透有呼吸感，皮肤白净无暇。适合晴天外景和清新风格。",tip:"日系不是曝光过度——保持细节再提明度"},
{cat:"调色",t:"电影感青橙色调",d:"暗部偏青蓝，亮部偏暖橙，对比度略高。这种色调有电影感和叙事感，适合黄昏、夜景和有故事感的场景。",tip:"青橙对比的关键是暗部够深，否则像滤镜堆叠"},
{cat:"光影",t:"光影对比法",d:"让一半面部在阴影中，一半在光中。强烈的光影对比产生戏剧性，适合表达内心矛盾或神秘氛围。",tip:"明暗交界线落在鼻梁上效果最经典"},
{cat:"姿势",t:"微表情抓拍法",d:"不拍大笑，拍微笑、凝视、低头瞬间。微表情比夸张表情更有感染力，也更真实自然。",tip:"和模特聊天时连续拍摄，抓自然微表情"},
{cat:"构图",t:"中心构图强调气场",d:"把人物正中放，正面直面镜头。中心构图最直接最有气场，适合表达自信、力量、正式感。",tip:"中心构图需要人物本身有足够气场撑住画面"},
{cat:"调色",t:"莫兰迪色调人像",d:"整体色调灰粉灰蓝灰绿，饱和度极低。莫兰迪色调高级温和有艺术感，适合室内和静物结合的人像。",tip:"莫兰迪不是灰——是在灰中保留微妙色彩倾向"},
{cat:"光影",t:"反射光补光技巧",d:"用白纸板、白墙或浅色地面做反射面，把光线反射到阴影面。免费的补光方式，让面部阴影柔和过渡。",tip:"反射面越大补光越均匀——一块白纸板就够了"},
{cat:"姿势",t:"手部姿势自然化",d:"手不知道怎么放就让它做事情：拿咖啡杯、整理头发、扶栏杆。有动作的手比空手更自然更有生活感。",tip:"手指微曲比完全伸直更优雅，像握着一个小球"},
{cat:"构图",t:"框架构图增加层次",d:"用门框、窗框、树冠、拱门等做画面框架。框架构图自然引导视线到人物，增加画面层次和故事感。",tip:"框架不要太完整，部分遮挡比全框更有呼吸感"},
{cat:"调色",t:"黑白人像经典处理",d:"转黑白后调整对比度让明暗分明。黑白去掉颜色干扰，纯粹看光影和表情，经典而有力。",tip:"黑白人像肤色要偏亮不能灰，否则像脏照片"},
{cat:"光影",t:"光斑氛围感拍摄",d:"通过树叶、百叶窗等制造光斑投射在人物或背景上。光斑增加画面浪漫和梦幻氛围，适合春夏户外。",tip:"光斑不要落在眼睛上，会干扰眼神表达"},
{cat:"姿势",t:"动态姿势连拍",d:"让模特做转圈、甩头发、跳跃等动作，你用连拍模式。动态姿势比静态更有生命力，抓到自然瞬间。",tip:"连拍选中间帧——开头太刻意，结尾太疲惫"},
{cat:"构图",t:"负空间构图法",d:"人物占画面很小比例，大面积是天空、墙壁等负空间。负空间构图营造孤独感、思考感、自由感。",tip:"负空间要有质感——纯蓝天比灰白墙更有意境"},
{cat:"调色",t:"暖冷对比色调法",d:"画面中暖色和冷色区域形成对比。暖冷对比制造视觉张力，让画面有冲突美和叙事深度。",tip:"暖冷对比不是平均分配——主色调占70%，对比色占30%"}

const FIN_TIPS=[
{cat:"存钱",t:"先存后花法则",d:"工资到手先存20-30%，剩下的才是可支配金额。不要先花再存——到月底通常已没钱可存。",tip:"设自动转账，发薪日当天转入储蓄账户，不需要意志力"},
{cat:"存钱",t:"52周递增存钱法",d:"第1周存10元，第2周20元…第52周520元。一年累计13780元，从小金额起步无痛攒钱。",tip:"可以反向操作——第1周520元递减，前期动力足后期轻松"},
{cat:"存钱",t:"365天随机存钱",d:"每天从1-365中随机选一个数字存对应金额。一年下来能存66795元，随机性让存钱不枯燥。",tip:"做好数字表格每天划掉一个，可视化进度更有成就感"},
{cat:"消费",t:"30天冷静期",d:"非必需品想买时先等30天。30天后还想买才是真需求，多数冲动欲望会消退。",tip:"把想买的东西记在清单上，日期+价格，30天后重新审视"},
{cat:"消费",t:"预算分类管理",d:"把支出分为：必需(房租/通勤)、改善(社交/学习)、可砍(零食/冲动)。必需不压缩，改善有计划，可砍直接砍。",tip:"每月做一次复盘——哪个分类超了？下月调整比例"},
{cat:"消费",t:"单价思维",d:"买东西看单价而不是总价。200元外套穿100次=2元/次，20元T恤穿5次=4元/次。性价比要看使用频次。",tip:"高频使用的物品可以买贵一点的，低频物品优先便宜"},
{cat:"消费",t:"替代品思维",d:"想买A的时候先想：有没有功能类似的B可以替代？很多消费有低成本的替代方案而不牺牲核心体验。",tip:"先搜替代方案再决定——90%的消费冲动都能被替代"},
{cat:"基础",t:"紧急备用金",d:"存够3-6个月的生活费作为紧急备用金。这是你的安全垫——失业、生病、意外都不至于手足无措。",tip:"备用金放货币基金或活期理财，随时可取但不随便动"},
{cat:"基础",t:"记账是第一步",d:"不记账=不知道钱去了哪里。哪怕粗糙地记也比不记好。先记一个月就能发现消费黑洞。",tip:"用最简单的方式记——手机备忘录也好，关键是坚持"},
{cat:"基础",t:"保险是性价比最高的理财",d:"年轻人必买：医疗险+意外险。每年几百块撬动几十万保额，是理财体系中杠杆最高的投资。",tip:"先买医疗险再买意外险，重疾险按经济能力酌情添加"},
{cat:"基础",t:"复利效应",d:"每月存1000元，年化8%，30年后≈150万。时间是复利的朋友，越早开始越轻松。",tip:"别等'有钱了再理财'——每月500起步也比0好得多"},
{cat:"避坑",t:"远离P2P和非法集资",d:"承诺高收益的基本是骗局。年化超过6%就要警惕，超过10%大概率是坑。保住本金比追求高收益重要100倍。",tip:"不懂的东西不碰——这条原则可以避免90%的投资陷阱"},
{cat:"避坑",t:"不要借钱投资",d:"借钱投资=加杠杆，赚了翻倍亏了翻倍亏。年轻人在没有稳定收入前绝对不要借钱投资。",tip:"信用卡分期买基金=最危险的操作，利率成本远超收益"},
{cat:"避坑",t:"警惕消费主义陷阱",d:"'精致生活'≠买贵东西。品牌溢价、社交媒体焦虑、同辈压力都在诱导你消费。记住：花钱买体验比买物品更值。",tip:"每月设置'无消费日'——一天什么都不买，体会克制"},
{cat:"存钱",t:"零钱存钱法",d:"每次用现金支付后的零钱单独存放，硬币和纸币都收。一个月下来零钱也能攒200-300元。",tip:"用透明罐子存零钱，看到增长过程更有动力"},
{cat:"存钱",t:"消费降级替代法",d:"不是不消费而是找平替。星巴克→便利店咖啡，品牌护肤品→成分相似的小众品牌。体验差距不大但省很多。",tip:"列出你每月的品牌消费清单，逐项找平替方案"},
{cat:"消费",t:"冲动消费记录法",d:"每次冲动消费后记录：买了什么、花了多少、后悔程度1-10。月底复盘你会发现冲动消费的后悔率远高于计划消费。",tip:"后悔率>7的消费下次坚决不买，后悔率<3的可以保留"},
{cat:"基础",t:"指数基金入门",d:"定投沪深300或中证500指数基金，是普通人最省心的理财方式。不需要选股，跟着大盘走，长期收益大概率跑赢通胀。",tip:"定投最大的敌人是中途放弃——跌的时候坚持买才是正确操作"},
{cat:"基础",t:"资产配置四笔钱",d:"按比例分配：日常(10%)、备用金(20%)、稳健投资(40%)、高风险投资(30%)。四笔钱各司其职，不互相挪用。",tip:"先建立备用金再开始投资，没有安全垫不要冒险"},
{cat:"避坑",t:"不追涨杀跌",d:"涨了兴奋追入，跌了恐慌卖出——这是散户亏钱的最大原因。定投的纪律性恰恰克服了人性弱点。",tip:"设置定投日不管涨跌都买——纪律比判断力更重要"},
{cat:"避坑",t:"远离'一夜暴富'心态",d:"理财是马拉松不是短跑。年化10%已经很优秀了，别幻想翻倍。稳定的小收益+时间=惊人的大结果。",tip:"把目标从'赚多少'改成'持续多少年'——持久才是赢家"},
{cat:"存钱",t:"工资日自动转存",d:"设置银行自动转账，工资到账当天就把储蓄金额转入专用账户。自动化执行不需要意志力。",tip:"储蓄账户和消费账户分开，物理隔离更不容易挪用"},
{cat:"消费",t:"花钱买时间而非物品",d:"花钱买能节省时间的服务（快递、打车、工具），比买物品更值。时间是年轻人最稀缺的资源。",tip:"计算你的时间价值——月薪5000=每小时约28元，低于这个的服务值得花钱买"},
{cat:"基础",t:"学一点税务知识",d:"了解个人所得税专项附加扣除，充分利用住房贷款、子女教育、继续教育等扣除项。每年可能省几千块。",tip:"税务知识=合法省钱，比理财收益更确定更直接"}
];

{cat:"成长",t:"《精进》",a:"采铜",d:"如何成为一个很厉害的人？不是学更多知识，而是优化时间、选择、行动、思维、才能五个维度。厉害是系统性优势而非单点突破。",k:"时间投资观：把时间当资源而非消耗；半衰期决策法：优先长半衰期选择"},

const DB={
  g(k){try{return JSON.parse(localStorage.getItem('xy_'+k))||null}catch{return null}},
  s(k,v){localStorage.setItem('xy_'+k,JSON.stringify(v))},
  d(k){localStorage.removeItem('xy_'+k)}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):s;
const fmtD=d=>{const dt=new Date(d);return dt.getFullYear()+'-'+(dt.getMonth()+1).toString().padStart(2,'0')+'-'+dt.getDate().toString().padStart(2,'0')};
function toast(msg,type='info'){
  const c=document.getElementById('tC');
  const t=document.createElement('div');
  t.className='toast';
  const icon=type==='success'?'✓':type==='error'?'✗':'ℹ';
  t.innerHTML=`<span>${icon}</span><span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pickN(a,n){return shuffle(a).slice(0,n)}

V.todo=function(){
  const items=DB.g('todos')||[];
  const done=items.filter(i=>i.done).length;
  const total=items.length;
  return `
    <div class="cd"><div class="ch"><div class="ct"><span class="ic2">✓</span> 待办事项</div><span class="cs">今日任务清单</span></div>
    <div class="tst">
      <div class="tst-i"><div class="n">${total}</div><div class="l">总任务</div></div>
      <div class="tst-i"><div class="n">${done}</div><div class="l">已完成</div></div>
      <div class="tst-i"><div class="n">${total-done}</div><div class="l">待完成</div></div>
    </div>
    <div class="ti-row"><input class="inp" id="todoIn" placeholder="添加新任务…" maxlength="100"><button class="btn btn-p btn-sm" onclick="addTodo()">添加</button></div>
    <ul class="tl" id="todoList">${items.map(i=>todoItemHTML(i)).join('')}</ul>
    ${items.length===0?'<div class="empty"><div class="ei">📝</div><div class="et">还没有任务，添加一个开始吧</div></div>':''}
  </div>`;
};
function todoItemHTML(i){
  return `<li class="ti-item${i.done?' done':''}" data-id="${i.id}">
    <div class="tcb${i.done?' chk':''}" onclick="togTodo('${i.id}')"></div>
    <span class="tt">${esc(i.text)}</span>
    <div class="ta"><button class="btn btn-g btn-i btn-sm" onclick="delTodo('${i.id}')">✗</button></div>
  </li>`;
}
function addTodo(){
  const inp=document.getElementById('todoIn');
  const t=inp.value.trim();if(!t)return toast('请输入任务内容','error');
  const items=DB.g('todos')||[];
  items.push({id:uid(),text:t,done:false,date:fmtD(Date.now())});
  DB.s('todos',items);inp.value='';renderView();toast('任务已添加','success');
}
function togTodo(id){
  const items=DB.g('todos')||[];
  const i=items.find(x=>x.id===id);if(i)i.done=!i.done;
  DB.s('todos',items);renderView();
}
function delTodo(id){
  const items=DB.g('todos')||[];
  DB.s('todos',items.filter(x=>x.id!==id));renderView();toast('任务已删除','success');
}

function saveWeight(){
  const val=parseFloat(document.getElementById('wVal').value);
  const date=document.getElementById('wDate').value;
  if(!val||val<=0||val>300)return toast('请输入有效体重','error');
  if(!date)return toast('请选择日期','error');
  let weights=DB.g('weights')||[];
  weights=weights.filter(w=>w.date!==date);
  weights.push({id:uid(),w:val,date});
  weights.sort((a,b)=>new Date(a.date)-new Date(b.date));
  DB.s('weights',weights);closeM();renderView();toast('体重已记录','success');

function renderWeightChart(data){
  if(data.length<2)return '';
  const W=320,H=100,p=10;
  const min=Math.min(...data.map(d=>d.w))-0.5;
  const max=Math.max(...data.map(d=>d.w))+0.5;
  const range=max-min||1;
  const pts=data.map((d,i)=>{
    const x=p+(i/(data.length-1))*(W-p*2);
    const y=H-p-((d.w-min)/range)*(H-p*2);
    return `${x},${y}`;
  }).join(' ');
  const dots=data.map((d,i)=>{
    const x=p+(i/(data.length-1))*(W-p*2);
    const y=H-p-((d.w-min)/range)*(H-p*2);
    return `<circle cx="${x}" cy="${y}" r="3" fill="#d97a96"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px">${dots}<polyline points="${pts}" fill="none" stroke="#d97a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

      ${toRead.length?`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;color:var(--t3);margin-bottom:4px">📋 待读</div>${toRead.map(b=>`<div class="lc"><div class="lpf">📋</div><div class="lif"><div class="lt">${esc(b.name)}</div></div><div style="display:flex;gap:3px"><button class="btn btn-s btn-sm" onclick="moveBook('${b.id}','在读')">开始读</button><button class="btn btn-d btn-i btn-sm" onclick="rmBook('${b.id}')">✗</button></div></div>`).join('')}</div>`:''}
      ${reading.length?`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;color:var(--p40);margin-bottom:4px">📖 在读</div>${reading.map(b=>`<div class="lc"><div class="lpf">📖</div><div class="lif"><div class="lt">${esc(b.name)}</div></div><div style="display:flex;gap:3px"><button class="btn btn-s btn-sm" onclick="moveBook('${b.id}','已读完')">读完</button><button class="btn btn-d btn-i btn-sm" onclick="rmBook('${b.id}')">✗</button></div></div>`).join('')}</div>`:''}
      ${finished.length?`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:500;color:#4a7a50;margin-bottom:4px">✅ 已读完</div>${finished.map(b=>`<div class="lc"><div class="lpf">✅</div><div class="lif"><div class="lt">${esc(b.name)}</div></div><div style="display:flex;gap:3px"><button class="btn btn-d btn-i btn-sm" onclick="rmBook('${b.id}')">✗</button></div></div>`).join('')}</div>`:''}
      ${!shelf.length?'<div class="empty"><div class="ei">📖</div><div class="et">书单还是空的，添加一本书开始吧</div></div>':''}
    </div>
    <div class="cd"><div class="ch"><div class="ct"><span class="ic2">✍️</span> 读书笔记&读后感</div></div>
      <div class="fg"><label class="lbl">书名</label><input class="inp" id="bnBook" placeholder="哪本书的笔记…" maxlength="40"></div>
      <div class="fg"><label class="lbl">摘抄</label><textarea class="txa" id="bnQuote" placeholder="书中打动你的段落…" maxlength="300"></textarea></div>
      <div class="fg"><label class="lbl">读后感</label><textarea class="txa" id="bnThought" placeholder="你的感悟和思考…" maxlength="300"></textarea></div>
      <button class="btn btn-p btn-sm" onclick="saveBookNote()">保存笔记</button>
      ${notes.length?notes.slice().reverse().map(n=>`<div class="rc">
        <div class="rc-t">📖 ${esc(n.book)}</div>
        <div class="rc-body"><b>摘抄：</b>${esc(n.quote)}</div>
        <div class="rc-tip"><b>感悟：</b>${esc(n.thought)}</div>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span style="font-size:11px;color:var(--t3)">${esc(n.date)}</span><button class="btn btn-d btn-sm" onclick="delBookNote('${n.id}')">删除</button></div>
      </div>`).join(''):'<div class="empty"><div class="ei">✍️</div><div class="et">暂无读书笔记</div></div>'}
    </div>`;
};
function addBook(){
  const name=document.getElementById('bkName').value.trim();
  const status=document.getElementById('bkStatus').value;
  if(!name)return toast('请输入书名','error');
  const shelf=DB.g('bookShelf')||[];
  shelf.push({id:uid(),name,status});
  DB.s('bookShelf',shelf);renderView();toast('已添加到书单','success');
}
function moveBook(id,status){
  const shelf=DB.g('bookShelf')||[];
  const b=shelf.find(x=>x.id===id);if(b)b.status=status;
  DB.s('bookShelf',shelf);renderView();toast('状态已更新','success');
}
function rmBook(id){const shelf=DB.g('bookShelf')||[];DB.s('bookShelf',shelf.filter(x=>x.id!==id));renderView();toast('已移除','success')}
function saveBookNote(){
  const book=document.getElementById('bnBook').value.trim();
  const quote=document.getElementById('bnQuote').value.trim();
  const thought=document.getElementById('bnThought').value.trim();
  if(!book||!quote&&!thought)return toast('请填写书名和内容','error');
  const notes=DB.g('bookNotes')||[];
  notes.push({id:uid(),book,quote,thought,date:fmtD(Date.now())});
  DB.s('bookNotes',notes);renderView();toast('笔记已保存','success');
}
function delBookNote(id){const notes=DB.g('bookNotes')||[];DB.s('bookNotes',notes.filter(x=>x.id!==id));renderView();toast('已删除','success')}

// ─── 数据备份/恢复 ───────────────────────────────────
function openBackup(){
  openM(`<div class="md-t">💾 数据备份与恢复</div>
    <div class="md-b">
      <p style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:12px">所有数据都存在浏览器本地。点击「导出备份」可下载 JSON 文件；换设备或重新部署后，点击「导入备份」选择该文件即可恢复。</p>
      <div class="fg"><button class="btn btn-p" onclick="exportData()" style="width:100%;justify-content:center">⬇️ 导出备份</button></div>
      <div class="fg"><label class="lbl">选择备份文件导入</label><input type="file" class="inp" id="impFile" accept=".json" onchange="importData(this)"></div>
    </div>
    <div class="md-f"><button class="btn btn-s" onclick="closeM()">关闭</button></div>`);
}
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('xy_')){try{data[k]=JSON.parse(localStorage.getItem(k))}catch{data[k]=localStorage.getItem(k)}}
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='xiaoy-backup-'+fmtD(Date.now())+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已下载','success');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data||typeof data!=='object')throw new Error('格式错误');
      let count=0;
      Object.entries(data).forEach(([k,v])=>{
        if(k.startsWith('xy_')){localStorage.setItem(k,JSON.stringify(v));count++}
      });
      closeM();renderView();toast(`已导入 ${count} 项数据`,'success');
    }catch(err){toast('导入失败：'+err.message,'error')}
  };
  reader.readAsText(file);
}

// ─── 每日刷新设置 ────────────────────────────────────
function openRefreshSetting(){
  const hour=DB.g('refreshHour');
  const h=hour===null?6:hour;
  openM(`<div class="md-t">⏰ 每日刷新时间</div>
    <div class="fg"><label class="lbl">每天几点自动刷新推荐内容？</label>
      <select class="sel" id="refreshHour">${Array.from({length:24},(_,i)=>`<option value="${i}" ${i===h?'selected':''}>${i.toString().padStart(2,'0')}:00</option>`).join('')}</select>
    </div>
    <div style="font-size:12px;color:var(--t3);line-height:1.6">设置后，每天到点会自动更换：今日单词、穿搭灵感、摄影技巧、理财小贴士、书籍推荐、语言表达课题。刷新前一天的记录会被保留在每日历史里。</div>
    <div class="md-f"><button class="btn btn-s" onclick="closeM()">取消</button><button class="btn btn-p" onclick="saveRefreshHour()">保存</button></div>`);
}
function saveRefreshHour(){
  const h=parseInt(document.getElementById('refreshHour').value,10);
  DB.s('refreshHour',h);
  DB.d('lastRefreshDate');
  closeM();
  checkDailyRefresh();
  renderView();
  toast(`已设置每天 ${h.toString().padStart(2,'0')}:00 自动刷新`,'success');
}
function checkDailyRefresh(){
  const hour=DB.g('refreshHour');
  if(hour===null)return;
  const today=fmtD(Date.now());
  const last=DB.g('lastRefreshDate')||'';
  if(last===today)return;
  const now=new Date();
  if(now.getHours()>=hour){
    DB.s('lastRefreshDate',today);
    refreshWords();refreshOutfit();refreshPhoto();refreshPhotoInsp();refreshFin();refreshBook();refreshVideo();nextExpr();refreshArticle();
    DB.s('dailyWords',curWords);DB.s('dailyOutfit',curOutfit);DB.s('dailyPhoto',curPhoto);DB.s('dailyPhotoInsp',curPhotoInsp);
    DB.s('dailyFin',curFin);DB.s('dailyBook',curBook);DB.s('dailyVideo',curVideo);DB.s('dailyExpr',curExpr);DB.s('dailyListen',curListen);DB.s('dailyLogic',curLogic);DB.s('dailyArticle',curArticle);
    toast('每日内容已刷新','success');
  }
}

init();
