<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--p30);border-radius:2px}
.app{display:flex;height:100dvh;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 日记模块 · 可爱风 */
.diary-head{text-align:center;padding:18px 14px;background:var(--gpk);border-radius:var(--r3);margin-bottom:14px;box-shadow:var(--s1);position:relative;overflow:hidden}
.diary-head::before{content:'🌸';position:absolute;top:8px;left:14px;font-size:18px;opacity:.65}
.diary-head::after{content:'✨';position:absolute;top:10px;right:16px;font-size:16px;opacity:.65}
.dh-emoji{font-size:34px;line-height:1}
.dh-t{font-size:18px;font-weight:700;color:var(--p60);margin-top:4px}
.dh-s{font-size:12px;color:var(--p50);margin-top:4px}
.dh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dh-moods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.mood-b.on{border-color:var(--p50);background:var(--p20);box-shadow:0 3px 10px rgba(217,122,150,.25)}
.dh-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

{en:'What impact could that be having on how we sleep?',zh:'这会对我们的睡眠产生怎样的影响？'},
{en:'Temperature and sleep are closely linked.',zh:'温度与睡眠密切相关。'},
{en:'Typically, our bodies cool themselves down before we sleep.',zh:'通常情况下，我们的身体在入睡前会自行降温。'},

{id:'bbc2',title:'The benefits of walking',zh:'散步的好处',words:342,duration:'2:18',level:3200,sentences:[

{en:'It does not require any special equipment.',zh:'它不需要任何特殊装备。'},
{en:'You can walk almost anywhere, at any time.',zh:'你几乎可以在任何地方、任何时间散步。'},
{en:'Regular walking helps improve heart health.',zh:'经常散步有助于改善心脏健康。'},

{en:'Many people find that walking clears their mind.',zh:'许多人发现散步能让头脑清醒。'},
{en:'A short walk after meals can aid digestion.',zh:'饭后散步一会儿可以帮助消化。'},
{en:'Try to walk for at least twenty minutes every day.',zh:'尽量每天散步至少二十分钟。'}

{en:'Memory plays an important role in our daily lives.',zh:'记忆力在我们的日常生活中扮演着重要角色。'},
{en:'There are simple ways to make it stronger.',zh:'有一些简单的方法可以增强记忆力。'},
{en:'Getting enough sleep is one of the most important.',zh:'充足的睡眠是其中最重要的一点。'},
{en:'Sleep helps the brain store information properly.',zh:'睡眠有助于大脑正确地储存信息。'},
{en:'Regular exercise also improves memory.',zh:'经常锻炼也能改善记忆力。'},
{en:'Another useful method is to review information often.',zh:'另一个有用的方法是经常复习信息。'},
{en:'Connecting new ideas to old ones makes them easier to remember.',zh:'把新想法与旧知识联系起来，能让它们更容易被记住。'},

{id:'bbc4',title:'Why do we procrastinate',zh:'我们为什么会拖延',words:356,duration:'2:28',level:3400,sentences:[
{en:'Procrastination means delaying tasks even when we know we should act.',zh:'拖延是指即使知道应该行动，却仍然推迟任务。'},
{en:'Many people procrastinate because they fear failure.',zh:'许多人拖延是因为他们害怕失败。'},
{en:'Others delay tasks because they feel overwhelmed.',zh:'另一些人拖延是因为他们感到不知所措。'},
{en:'When a task seems too big, starting feels difficult.',zh:'当一项任务看起来太庞大时，开始就显得困难。'},
{en:'One way to beat procrastination is to break tasks into small steps.',zh:'战胜拖延的一个方法是把任务拆成小步骤。'},
{en:'Setting a clear deadline can also help.',zh:'设定明确的截止日期也会有帮助。'},
{en:'Finishing a small step gives us a sense of progress.',zh:'完成一小步会给我们带来进步感。'},
{en:'Progress, not perfection, is the key to getting things done.',zh:'进步而非完美，才是把事情做完的关键。'}
]},

const SPEAK=[
{brief:"今天学一个让人印象深刻的开场方式",full:"开场白决定别人对你的第一印象。试试用一句有趣的观察或反问切入，比'大家好'更有吸引力。比如：'你们有没有发现，最忙的人反而最有时间？'",tip:"开场三秒定胜负。不要平淡问候，用一个小钩子拉住注意力。"},
{brief:"用'三个关键词'法组织思路",full:"说话前想好三个关键词，围绕它们展开。比如介绍自己：'好奇、行动、温度'——好奇让我探索，行动让我落地，温度让我共情。",tip:"三个关键词比长篇大论更容易被记住。"},
{brief:"说话要有'节奏感'——快慢交替",full:"重要观点放慢语速，过渡信息可以加快。像音乐一样有高低起伏，听众才不会走神。",tip:"平铺直叙=催眠曲。关键处停顿1秒，效果翻倍。"},
{brief:"结尾要有力——别让话'散掉'",full:"结尾用一个总结句或行动号召收束。比如：'所以，今天我们做一件事就好——开始。'不要用'就这样吧'来收尾。",tip:"结尾是最后的印象，不要让它变成'嗯…就这些'。"},
{brief:"学会用比喻让复杂概念变简单",full:"把抽象概念映射到生活场景。比如：'自律不是监狱，而是方向舵——它不是限制自由，而是引导自由。'",tip:"好比喻让听众秒懂，比解释五分钟更有效。"},
{brief:"回应前先重复对方的关键词",full:"当对方说完，先重复一个关键词再回应。这表示你在认真听，也让对话有连贯性。比如：'你说的「节奏感」很有意思…'",tip:"重复关键词=我听见了你。比'嗯嗯对对对'高级得多。"},
{brief:"避免用'其实'开头",full:"'其实'是口语中的稀释词，会让后面的内容显得没那么重要。直接说你的观点，不加铺垫。",tip:"删掉'其实'、'说白了'、'个人感觉'——你的话不需要打折。"},
{brief:"练习'一句话总结'能力",full:"每次讨论后，尝试用一句话概括核心。这锻炼你的提炼和逻辑能力。比如：'核心就是：先有输入，才有输出。'",tip:"一句话总结是你对内容的真正理解。做不到=没懂透。"},
{brief:"用'反过来想'制造冲突感",full:"说观点时，先抛出反面：'大家都觉得XX是对的，但我想说…'这种冲突让听众大脑被激活。",tip:"冲突=注意力。不要只说正面的，先制造一个对立面。"},
{brief:"用具体数字代替模糊描述",full:"'很多人'→'80%的人'，'花了很久'→'3个月'。数字让话有力量，也显得你做过功课。",tip:"模糊=不靠谱。具体数字=有依据。哪怕估算也比'很多'好。"},
{brief:"练习'3句话输出法'",full:"任何话题，练习用3句话说完：1句观点→1句论据→1句结论。简洁是最高级的能力。",tip:"能3句话说完的，就不要用10句。冗长=思维混乱。"},
{brief:"倾听时做笔记——用关键词记",full:"听人说话时，在脑中提取关键词。不记全句，只记核心词。这让你回应时能精准引用对方内容。",tip:"关键词笔记比全文笔记高效10倍。"},
{brief:"别怕沉默——停顿是力量",full:"说完重要观点后停顿2秒。沉默不是尴尬，而是给听众消化时间。敢于停顿的人显得更自信。",tip:"敢停=敢控场。急着填补沉默反而暴露紧张。"}
];

{cat:"调色",t:"低饱和柔调色调",d:"降低整体饱和度，提升明度，色温偏暖。这种色调皮肤通透有质感，画面温柔高级，适合人像和日常场景。",tip:"降饱和的同时保持肤色自然，不要变成灰白"},
{cat:"调色",t:"胶片感复古色调",d:"加一点颗粒感，色温偏暖偏黄，暗部加青蓝。模拟胶片的色调有年代感和故事感，适合街拍和人文场景。",tip:"颗粒感要轻，太重像劣质照片而非胶片"},
{cat:"调色",t:"清透日系色调",d:"高明度+低对比+偏冷色温。日系色调干净通透有呼吸感，皮肤白净无暇。适合晴天外景和清新风格。",tip:"日系不是曝光过度——保持细节再提明度"},
{cat:"调色",t:"电影感青橙色调",d:"暗部偏青蓝，亮部偏暖橙，对比度略高。这种色调有电影感和叙事感，适合黄昏、夜景和有故事感的场景。",tip:"青橙对比的关键是暗部够深，否则像滤镜堆叠"},
{cat:"光影",t:"光影对比法",d:"让一半面部在阴影中，一半在光中。强烈的光影对比产生戏剧性，适合表达内心矛盾或神秘氛围。",tip:"明暗交界线落在鼻梁上效果最经典"},
{cat:"姿势",t:"微表情抓拍法",d:"不拍大笑，拍微笑、凝视、低头瞬间。微表情比夸张表情更有感染力，也更真实自然。",tip:"和模特聊天时连续拍摄，抓自然微表情"},
{cat:"构图",t:"中心构图强调气场",d:"把人物正中放，正面直面镜头。中心构图最直接最有气场，适合表达自信、力量、正式感。",tip:"中心构图需要人物本身有足够气场撑住画面"},
{cat:"调色",t:"莫兰迪色调人像",d:"整体色调灰粉灰蓝灰绿，饱和度极低。莫兰迪色调高级温和有艺术感，适合室内和静物结合的人像。",tip:"莫兰迪不是灰——是在灰中保留微妙色彩倾向"},
{cat:"光影",t:"反射光补光技巧",d:"用白纸板、白墙或浅色地面做反射面，把光线反射到阴影面。免费的补光方式，让面部阴影柔和过渡。",tip:"反射面越大补光越均匀——一块白纸板就够了"},
{cat:"姿势",t:"手部姿势自然化",d:"手不知道怎么放就让它做事情：拿咖啡杯、整理头发、扶栏杆。有动作的手比空手更自然更有生活感。",tip:"手指微曲比完全伸直更优雅，像握着一个小球"},
{cat:"构图",t:"框架构图增加层次",d:"用门框、窗框、树冠、拱门等做画面框架。框架构图自然引导视线到人物，增加画面层次和故事感。",tip:"框架不要太完整，部分遮挡比全框更有呼吸感"},

function enStop(){
  if(enUtter){enUtter.onend=null;try{speechSynthesis.cancel()}catch(e){}enUtter=null}
  enPlayer.playing=false;renderView();
}
function enSpeakIndex(idx){
  const art=enArticle();if(!art)return;
  idx=Math.max(0,Math.min(idx,art.sentences.length-1));
  enPlayer.index=idx;setEnProgress(art.id,idx);renderView();
  const s=art.sentences[idx];
  speechSynthesis.cancel();
  enUtter=new SpeechSynthesisUtterance(s.en);enUtter.lang='en-US';enUtter.rate=enPlayer.rate;
  enUtter.onend=()=>{
    if(enPlayer.loop){enSpeakIndex(idx);return}
    if(idx+1<art.sentences.length){enSpeakIndex(idx+1)}else{enPlayer.playing=false;renderView();}
  };
  enUtter.onerror=()=>{enPlayer.playing=false;renderView();};
  speechSynthesis.speak(enUtter);enPlayer.playing=true;
  enScrollToActive();
}
function enTogglePlay(){
  if(enPlayer.playing){enStop();return}
  if(enPlayer.id)enSpeakIndex(enPlayer.index);else openEnglishPlayer(BBC_ARTICLES[0].id);
}
function enPrev(){const art=enArticle();if(!art)return;enSpeakIndex(Math.max(0,enPlayer.index-1))}

  const fmt=n=>n.toString().padStart(2,'0');return `${fmt(Math.floor(curSec/60))}:${fmt(curSec%60)}`;
}

let enVocabWords=[];
function enVocabTrain(){
  const art=enArticle();if(!art)return;
  const all=art.sentences.map(s=>s.en).join(' ').toLowerCase().match(/[a-z]+/g)||[];
  const common={'the':1,'and':1,'to':1,'of':1,'a':1,'in':1,'is':1,'it':1,'that':1,'for':1,'are':1,'as':1,'on':1,'with':1,'this':1,'can':1,'be':1,'or':1,'from':1,'at':1,'an':1,'not':1,'but':1,'have':1,'has':1,'had':1,'do':1,'does':1,'did':1,'will':1,'would':1,'could':1,'should':1,'we':1,'you':1,'they':1,'he':1,'she':1,'i':1,'my':1,'your':1,'their':1,'our':1,'us':1,'them':1,'his':1,'her':1,'its':1};
  const words=[];const seen={};
  for(const w of all){if(common[w]||seen[w]||w.length<4)continue;seen[w]=1;words.push(w)}
  enVocabWords=words.slice(0,5);
  if(!enVocabWords.length){toast('本课暂无推荐单词','info');return}
  openM(`<div class="md-t">🎓 单词训练 · ${esc(art.title)}</div>
    <div style="max-height:60vh;overflow-y:auto">${enVocabWords.map((w,i)=>`<div class="fg"><label class="lbl">${i+1}. ${esc(w)}</label><input class="inp" id="vw${i}" placeholder="请输入中文意思"></div>`).join('')}</div>
    <div class="md-f"><button class="btn btn-s" onclick="closeM()">关闭</button><button class="btn btn-p" onclick="enCheckVocab()">检查答案</button></div>`);
}

function renderWeightChart(data){
  if(data.length<2)return '';
  const W=320,H=100,p=10;
  const min=Math.min(...data.map(d=>d.w))-0.5;
  const max=Math.max(...data.map(d=>d.w))+0.5;
  const range=max-min||1;
  const pts=data.map((d,i)=>{
    const x=p+(i/(data.length-1))*(W-p*2);
    const y=H-p-((d.w-min)/range)*(H-p*2);
    return `${x},${y}`;
  }).join(' ');
  const dots=data.map((d,i)=>{
    const x=p+(i/(data.length-1))*(W-p*2);
    const y=H-p-((d.w-min)/range)*(H-p*2);
    return `<circle cx="${x}" cy="${y}" r="3" fill="#d97a96"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px">${dots}<polyline points="${pts}" fill="none" stroke="#d97a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function donutSVG(expByCat){
  const cats=EXP_CATS.filter(c=>expByCat[c]);
  const total=cats.reduce((s,c)=>s+expByCat[c],0);
  if(!total)return '';
  const colors={餐饮:'#D4537E',交通:'#378ADD',购物:'#639922',房租:'#BA7517',娱乐:'#534AB7',其他:'#9a8f86'};
  const R=58,C=2*Math.PI*R;let off=0,arcs='';
  cats.forEach(c=>{
    const len=expByCat[c]/total*C;
    arcs+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${colors[c]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"></circle>`;
    off+=len;
  });
  const legend=cats.map(c=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:${colors[c]};display:inline-block;flex-shrink:0"></span><span style="flex:1;color:var(--t2)">${esc(c)}</span><span style="color:var(--t1);font-weight:600">${Math.round(expByCat[c]/total*100)}%</span><span style="color:var(--t1);font-weight:600;min-width:48px;text-align:right">¥${expByCat[c].toFixed(0)}</span></div>`).join('');
  return `<div class="cd"><div class="ch"><div class="ct"><span class="ic2">📊</span> 支出占比</div><span class="cs">本月各类支出分布</span></div>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <svg viewBox="0 0 160 160" width="160" height="160" style="flex-shrink:0;max-width:45%">
        <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--p10)" stroke-width="18"></circle>
        ${arcs}
        <text x="80" y="74" text-anchor="middle" font-size="12" fill="var(--t3)">总支出</text>
        <text x="80" y="98" text-anchor="middle" font-size="19" font-weight="700" fill="var(--p40)">¥${total.toFixed(0)}</text>
      </svg>
      <div style="flex:1;min-width:150px">${legend}</div>
    </div>
  </div>`;
}

function diaryAddImg(input){
  const files=input.files;if(!files||!files.length)return;

  for(const f of files){
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const max=900;let w=img.width,h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const cx=c.getContext('2d');cx.drawImage(img,0,0,w,h);

// 录音存 IndexedDB（避免 localStorage 容量爆掉）
const AUD=(()=>{
  const DBNAME='xy_audio',STORE='recs',VER=1;let dbp=null;
  function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,VER);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
  function store(mode){return open().then(db=>db.transaction(STORE,mode).objectStore(STORE))}
  return {
    put(k,b){return store('readwrite').then(s=>new Promise((res,rej)=>{const rq=s.put(b,k);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error)}))},
    get(k){return store('readonly').then(s=>new Promise((res,rej)=>{const rq=s.get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))},
    del(k){return store('readwrite').then(s=>new Promise((res,rej)=>{const rq=s.delete(k);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error)}))}
  };
})();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function daySeed(d){const dt=new Date(d+'T00:00:00');const base=new Date(dt.getFullYear()+'-01-01T00:00:00');return Math.floor((dt-base)/86400000)+1}
function seededShuffle(arr,seed){const r=mulberry32(seed);const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function moodTopicsToday(d){const seed=daySeed(d||fmtD(Date.now()));return seededShuffle(MOOD_TOPICS,seed).slice(0,3)}
function moodEssayToday(d){const seed=daySeed(d||fmtD(Date.now()));return MOOD_ESSAYS[seed%MOOD_ESSAYS.length]}

// 录音（朗读话题）
let recState={idx:null,active:false,secs:0,mr:null,chunks:[],stream:null,timer:null,requesting:false};
function fmtRec(s){const m=Math.floor(s/60),ss=s%60;return(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}
function startRec(idx){
  if(recState.active||recState.requesting)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return toast('当前环境不支持录音 🎤','error');
  speechSynthesis.cancel();
  recState={idx,active:false,secs:0,mr:null,chunks:[],stream:null,timer:null,requesting:true};
  renderView();
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recState.stream=stream;
    let mt='';
    const cands=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
    for(const c of cands){if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c)){mt=c;break}}
    const mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
    recState.mr=mr;recState.chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)recState.chunks.push(e.data)};
    mr.onstop=()=>{const s=recState.stream;if(s)s.getTracks().forEach(t=>t.stop());saveRec(idx);};
    mr.start();
    recState.active=true;recState.requesting=false;recState.secs=0;
    recState.timer=setInterval(()=>{recState.secs++;const el=document.getElementById('recTimer');if(el)el.textContent=fmtRec(recState.secs)},1000);
    renderView();
  }).catch(()=>{recState={idx:null,active:false,secs:0,mr:null,chunks:[],stream:null,timer:null,requesting:false};toast('无法访问麦克风，请允许录音权限 🎤','error');renderView()});
}
function stopRec(){if(recState.mr&&recState.mr.state!=='inactive')recState.mr.stop();if(recState.timer)clearInterval(recState.timer)}
function saveRec(idx){
  if(!recState.chunks.length){recState={idx:null,active:false,secs:0,mr:null,chunks:[],stream:null,timer:null,requesting:false};return renderView()}
  const blob=new Blob(recState.chunks,{type:recState.chunks[0]?recState.chunks[0].type:'audio/webm'});
  const dur=recState.secs;const date=moodSelDate;const key=date+'_'+idx;
  recState={idx:null,active:false,secs:0,mr:null,chunks:[],stream:null,timer:null,requesting:false};
  AUD.put('mood_'+key,blob).then(()=>{
    const meta=DB.g('moodRecMeta')||{};
    meta[key]={date,idx,dur};
    DB.s('moodRecMeta',meta);
    renderView();toast('朗读录音已保存 🎉','success');
  }).catch(()=>toast('录音保存失败，请稍后重试','error'));
}
function playRec(key){
  const meta=(DB.g('moodRecMeta')||{})[key];if(!meta)return;
  AUD.get('mood_'+key).then(blob=>{
    if(!blob)return toast('录音丢失，请重新录制','error');
    const url=URL.createObjectURL(blob);const a=new Audio(url);
    a.onended=()=>URL.revokeObjectURL(url);
    a.play().catch(()=>toast('播放失败','error'));
  });
}
function delRec(key){AUD.del('mood_'+key);const meta=DB.g('moodRecMeta')||{};delete meta[key];DB.s('moodRecMeta',meta);renderView();toast('录音已删除','success')}

// 每日文摘朗读
let curMoodEssay=null,essayUtter=null,essayPlaying=false,essayIdx=0;
function essaySetActive(i){document.querySelectorAll('.essay-p').forEach(el=>el.classList.remove('on'));if(i>=0){const el=document.getElementById('essay-para-'+i);if(el)el.classList.add('on')}}
function essayBtnLabel(t){const b=document.getElementById('essayPlayBtn');if(b)b.textContent=t}
function essaySpeak(i){
  if(!curMoodEssay)return;
  speechSynthesis.cancel();essayIdx=i;
  const p=curMoodEssay.ps[i];
  essayUtter=new SpeechSynthesisUtterance(p);
  essayUtter.lang='zh-CN';essayUtter.rate=0.95;
  essayUtter.onend=()=>{if(i+1<curMoodEssay.ps.length){essaySpeak(i+1)}else{essayPlaying=false;essaySetActive(-1);essayBtnLabel('▶ 朗读全文')}};
  essayUtter.onerror=()=>{essayPlaying=false;essaySetActive(-1);essayBtnLabel('▶ 朗读全文')};
  speechSynthesis.speak(essayUtter);essayPlaying=true;essaySetActive(i);essayBtnLabel('⏸ 暂停');
}
function essayToggle(){if(!curMoodEssay)return;if(essayPlaying){speechSynthesis.cancel();essayPlaying=false;essaySetActive(-1);essayBtnLabel('▶ 朗读全文')}else{essaySpeak(essayIdx>=curMoodEssay.ps.length?0:essayIdx)}}

V.mood=function(){
  const vd=moodSelDate;
  const topics=moodTopicsToday(vd);
  const essay=moodEssayToday(vd);
  curMoodEssay=essay;
  const meta=DB.g('moodRecMeta')||{};
  const entries=(DB.g('moodEntries')||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const recCard=(idx)=>{
    const key=vd+'_'+idx;const m=meta[key];const rec=recState;
    if(rec.active&&rec.idx===idx)return `<div class="topic-ctrl"><button class="rec-btn rec active" onclick="stopRec()">⏹ 停止 <span id="recTimer">${fmtRec(rec.secs)}</span></button></div>`;
    if(rec.requesting&&rec.idx===idx)return `<div class="topic-ctrl"><button class="rec-btn rec" disabled>🎤 准备中…</button></div>`;
    if(m)return `<div class="topic-ctrl">
      <button class="rec-btn play" onclick="playRec('${key}')">▶ 播放</button>
      <span class="rec-dur">⏱ ${fmtRec(m.dur)}</span>
      <button class="rec-btn del" onclick="delRec('${key}')">🗑 删除</button>
      <button class="rec-btn rec" onclick="startRec(${idx})">🎤 重录</button>
    </div>`;
    return `<div class="topic-ctrl"><button class="rec-btn rec" onclick="startRec(${idx})">🎤 朗读录音</button></div>`;
  };
  return `
    <div class="mood-head">
      <div class="mh-emoji">💗</div>
      <div class="mh-t">心情空间</div>
      <div class="mh-s">记下今天的心情，朗读三个话题，听一篇精美文摘</div>
    </div>

    <div class="cd">
      <div class="dh-row">
        <label class="lbl" style="margin:0">📅 日期（可选）</label>
        <input type="date" class="inp" id="moodDate" value="${vd}" onchange="moodOnDate(this.value)" style="max-width:170px">
      </div>
      <div class="dh-moods">${MOOD_MOODS.map(m=>`<button class="mood-b${m===moodDraftMood?' on':''}" onclick="moodSetMood('${m}')">${m}</button>`).join('')}</div>
      <textarea class="txa" id="moodNote" placeholder="今天心情怎么样？写几句话吧～ 🌸" maxlength="2000">${esc(moodDraftNote)}</textarea>
      <button class="btn btn-p btn-sm" onclick="saveMood()" style="width:100%;justify-content:center;margin-top:12px">💖 保存心情</button>
    </div>

    <div class="mood-sec"><span class="ms-ic">🗣️</span> 每日表达话题 <span class="ms-sub">每天 3 个 · 点「朗读录音」读出你的回答</span></div>
    ${topics.map((q,i)=>`<div class="topic-card">
      <div class="topic-num">${i+1}</div>
      <div class="topic-q">${esc(q)}</div>
      ${recCard(i)}
    </div>`).join('')}

    <div class="mood-sec"><span class="ms-ic">📖</span> 每日文摘 <span class="ms-sub">${esc(essay.author)} · 可朗读</span></div>
    <div class="essay-card">
      <div class="essay-t">${esc(essay.title)}</div>
      <div class="essay-a">—— ${esc(essay.author)}</div>
      ${essay.ps.map((p,i)=>`<div class="essay-p" id="essay-para-${i}">${esc(p)}</div>`).join('')}
      <div class="essay-ctrl"><button class="btn btn-p btn-sm" id="essayPlayBtn" onclick="essayToggle()">▶ 朗读全文</button></div>
    </div>

    ${entries.length?`<div class="cd"><div class="ch"><div class="ct"><span class="ic2">🌟</span> 往日心情</div><span class="cs">共 ${entries.length} 篇</span></div>
      ${entries.map(e=>`<div class="dl">
        <div class="dl-h"><span class="dl-d">${e.date}</span><span class="dl-m">${e.mood||'😊'}</span></div>
        ${e.note?`<div class="dl-t">${esc(e.note).replace(/\n/g,'<br>')}</div>`:''}
        <div class="dl-f"><button class="btn btn-d btn-sm" onclick="delMood('${e.id}')">删除</button></div>
      </div>`).join('')}
    </div>`:'<div class="empty"><div class="ei">💗</div><div class="et">还没有心情记录，写下第一篇吧</div></div>'}
  `;
};

// ─── 数据备份/恢复 ───────────────────────────────────
function openBackup(){
  openM(`<div class="md-t">💾 数据备份与恢复</div>
    <div class="md-b">
      <p style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:12px">所有数据都存在浏览器本地。点击「导出备份」可下载 JSON 文件；换设备或重新部署后，点击「导入备份」选择该文件即可恢复。</p>
      <div class="fg"><button class="btn btn-p" onclick="exportData()" style="width:100%;justify-content:center">⬇️ 导出备份</button></div>
      <div class="fg"><label class="lbl">选择备份文件导入</label><input type="file" class="inp" id="impFile" accept=".json" onchange="importData(this)"></div>
    </div>
    <div class="md-f"><button class="btn btn-s" onclick="closeM()">关闭</button></div>`);
}
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('xy_')){try{data[k]=JSON.parse(localStorage.getItem(k))}catch{data[k]=localStorage.getItem(k)}}
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='xiaoy-backup-'+fmtD(Date.now())+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已下载','success');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data||typeof data!=='object')throw new Error('格式错误');
      let count=0;
      Object.entries(data).forEach(([k,v])=>{
        if(k.startsWith('xy_')){localStorage.setItem(k,JSON.stringify(v));count++}
      });
      closeM();renderView();toast(`已导入 ${count} 项数据`,'success');
    }catch(err){toast('导入失败：'+err.message,'error')}
  };
  reader.readAsText(file);
}

// ─── 每日刷新设置 ────────────────────────────────────
function openRefreshSetting(){
  const hour=DB.g('refreshHour');
  const h=hour===null?6:hour;
  openM(`<div class="md-t">⏰ 每日刷新时间</div>
    <div class="fg"><label class="lbl">每天几点自动刷新推荐内容？</label>
      <select class="sel" id="refreshHour">${Array.from({length:24},(_,i)=>`<option value="${i}" ${i===h?'selected':''}>${i.toString().padStart(2,'0')}:00</option>`).join('')}</select>
    </div>
    <div style="font-size:12px;color:var(--t3);line-height:1.6">设置后，每天到点会自动更换：今日单词、摄影技巧、语言表达课题。刷新前一天的记录会被保留在每日历史里。</div>
    <div class="md-f"><button class="btn btn-s" onclick="closeM()">取消</button><button class="btn btn-p" onclick="saveRefreshHour()">保存</button></div>`);
}
function saveRefreshHour(){
  const h=parseInt(document.getElementById('refreshHour').value,10);
  DB.s('refreshHour',h);
  DB.d('lastRefreshDate');
  closeM();
  checkDailyRefresh();
  renderView();
  toast(`已设置每天 ${h.toString().padStart(2,'0')}:00 自动刷新`,'success');
}
function checkDailyRefresh(){
  const hour=DB.g('refreshHour');
  if(hour===null)return;
  const today=fmtD(Date.now());
  const last=DB.g('lastRefreshDate')||'';
  if(last===today)return;
  const now=new Date();
  if(now.getHours()>=hour){
    DB.s('lastRefreshDate',today);
    refreshWords();refreshPhoto();refreshPhotoInsp();nextExpr();articleOffset=0;curArticle=articleByDate(0);
    DB.s('dailyWords',curWords);DB.s('dailyPhoto',curPhoto);DB.s('dailyPhotoInsp',curPhotoInsp);
    DB.s('dailyExpr',curExpr);DB.s('dailyListen',curListen);DB.s('dailyLogic',curLogic);DB.s('articleOffset',articleOffset);DB.s('dailyArticle',curArticle);
    toast('每日内容已刷新','success');
  }
}

  checkVP();

  }).catch(()=>{});
}
