<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--p30);border-radius:2px}
.app{display:flex;height:100dvh;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sb{width:220px;min-width:220px;background:rgba(255,252,250,.92);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:all .35s;z-index:100;box-shadow:2px 0 20px rgba(217,122,150,.06);backdrop-filter:blur(8px)}

.btn-p{background:var(--gac);color:#fff;box-shadow:0 4px 12px rgba(217,122,150,.2)}.btn-p:hover{transform:translateY(-1px)}
.btn-s{background:var(--p10);color:var(--p50)}.btn-s:hover{background:var(--p20)}
.btn-g{background:transparent;color:var(--t2)}.btn-g:hover{background:var(--p10);color:var(--p40)}
.btn-d{background:transparent;color:#d99a8a}.btn-d:hover{background:#fceee8;color:#c9786a}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tst{display:flex;gap:12px;margin-bottom:14px;padding:12px;background:var(--p10);border-radius:var(--r1);flex-wrap:wrap}.tst-i .n{font-size:18px;font-weight:700;color:var(--p40)}.tst-i .l{font-size:10px;color:var(--t3)}
.lc{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--cream);border-radius:var(--r1);margin-bottom:6px;border:1px solid transparent;transition:var(--t)}.lc:hover{border-color:var(--bd)}

.sh{text-align:center;padding:24px;background:var(--gac);border-radius:var(--r4);margin-bottom:14px;position:relative;overflow:hidden}.sh::before{content:'';position:absolute;top:-20px;right:-20px;width:90px;height:90px;background:rgba(255,255,255,.15);border-radius:50%}
.sh .sl{font-size:12px;color:#fff;opacity:.9;margin-bottom:6px;position:relative;white-space:nowrap}.sh .sa{font-size:28px;font-weight:700;color:#fff;position:relative;white-space:nowrap}.sh-target{font-size:13px;color:#fff;opacity:.85;margin-top:4px;white-space:nowrap}
.pb-c{margin-top:14px}.pb-bg{width:100%;height:10px;background:rgba(255,255,255,.3);border-radius:5px;overflow:hidden}.pb-fl{height:100%;background:#fff;border-radius:5px;transition:width .6s}.pb-i{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#fff;opacity:.9;white-space:nowrap}

.art-t{font-size:16px;font-weight:600;color:var(--t1);margin:14px 0 8px}.art-e{font-size:15px;color:var(--t1);line-height:1.8;margin-bottom:10px}.art-z{font-size:13px;color:var(--t2);line-height:1.7;padding:12px;background:var(--cream);border-radius:var(--r1);border-left:3px solid var(--p40)}
.ex-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.ex-si{padding:16px;border-radius:var(--r2);text-align:center;background:var(--gpk)}.ex-si .el{font-size:10px;color:var(--t3);margin-bottom:4px}.ex-si .ev{font-size:22px;font-weight:700;color:var(--t1)}

.inp,.txa,.sel{font-size:16px;padding:11px 12px}
.md{padding:20px;border-radius:var(--r4) var(--r4) 0 0;width:100%;max-width:100%}

}

<body>
<div class="app">
<div class="ov" id="overlay" onclick="closeSB()"></div>
<aside class="sb" id="sidebar">
<div class="sb-hd"><div class="sb-logo"><svg viewBox="0 0 100 100"><circle cx="30" cy="28" r="13" fill="#D4A574"/><circle cx="30" cy="28" r="7" fill="#C4956A"/><circle cx="70" cy="28" r="13" fill="#D4A574"/><circle cx="70" cy="28" r="7" fill="#C4956A"/><circle cx="50" cy="55" r="25" fill="#D4A574"/><ellipse cx="50" cy="62" rx="12" ry="10" fill="#F0DCC4"/><circle cx="40" cy="50" r="3" fill="#5A3E2B"/><circle cx="60" cy="50" r="3" fill="#5A3E2B"/><circle cx="42" cy="49" r="1" fill="#FFF"/><circle cx="62" cy="49" r="1" fill="#FFF"/><ellipse cx="50" cy="58" rx="4" ry="3" fill="#5A3E2B"/><text x="50" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#D4A574">Y</text></svg></div><div class="sb-tit">小Y的工作台</div><button class="sb-tog" onclick="togSB()">◀</button></div>

  <button class="btn btn-s btn-sm" onclick="openRefreshSetting()">⏰ 刷新</button>
  <button class="btn btn-s btn-sm" onclick="openBackup()">💾 备份</button>
</div>
</aside>
